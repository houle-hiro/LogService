# 日志服务配置文件
# 采用 YAML 格式，支持结构化配置

server:
  # 服务监听端口
  port: 8080
  # 读取超时时间（秒）
  read_timeout: 30
  # 写入超时时间（秒）
  write_timeout: 30
  # 空闲超时时间（秒）
  idle_timeout: 120

storage:
  # 日志文件存储路径
  path: "./data"
  # 日志文件最大保留时间（秒），默认 30 天
  max_age_seconds: 2592000

upload:
  # 最大上传文件大小（MB）
  max_size_mb: 100

ratelimit:
  # 限流：每时间窗口允许的最大请求数
  limit: 100
  # 限流时间窗口（秒）
  interval_seconds: 60
