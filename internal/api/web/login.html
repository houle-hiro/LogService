<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · 文件中转</title>
<style>
  :root{--bg:#f4f6f8;--card:#fff;--text:#1f2328;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--danger:#dc2626}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .card{width:min(360px,92vw);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px 24px;box-shadow:0 8px 30px rgba(15,23,42,.06)}
  h1{margin:0 0 4px;font-size:20px}
  .sub{margin:0 0 20px;color:var(--muted);font-size:13px}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:14px}
  input{display:block;width:100%;margin-top:6px;padding:9px 11px;font-size:14px;border:1px solid var(--line);border-radius:8px;outline:none;background:#fff;color:var(--text)}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  button{width:100%;padding:10px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-size:14px;cursor:pointer}
  button:hover{filter:brightness(.95)}
  .err{margin:0 0 14px;padding:8px 10px;border-radius:8px;background:#fef2f2;color:var(--danger);font-size:13px}
</style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <h1>文件中转</h1>
    <p class="sub">上传、查询、下载，按用户名隔离</p>
    {{if .Error}}<p class="err">{{.Error}}</p>{{end}}
    <label>用户名
      <input name="username" required autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="例如 alice">
    </label>
    {{if .AuthEnabled}}
    <label>访问口令
      <input name="token" type="password" required autocomplete="current-password" placeholder="请输入访问口令">
    </label>
    {{end}}
    <input type="hidden" name="next" value="{{.Next}}">
    <button type="submit">进入</button>
  </form>
</body>
</html>
